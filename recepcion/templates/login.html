<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Clínica</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #edf5fb, #e8f0f6);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #f9fbfd;
            border-radius: 14px;
            box-shadow: 0 10px 26px rgba(44, 74, 101, 0.12);
            width: 420px;
            padding: 30px;
            border: 1px solid #dfeaf3;
        }
        h1 {
            text-align: center;
            color: #274b69;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #34506d;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border: 1px solid #c9d9e7;
            border-radius: 8px;
            box-sizing: border-box;
            background: #ffffff;
        }
        button {
            width: 100%;
            background: #5d8fb9;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: #4b789d; }
        .error {
            color: #8c2f35;
            background: #fbe9eb;
            border: 1px solid #ecc7ca;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 18px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Ingreso al Sistema de Triage</h1>

        {% if messages %}
            <div class="error">
                {% for message in messages %}
                    <div>{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <label>Usuario:</label>
            <input type="text" name="username" required>

            <label>Contraseña:</label>
            <input type="password" name="password" required>

            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ accion }} Paciente</title>
</head>
<body>
    <h1>{{ accion }} Paciente</h1>
    
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <!-- CRÍTICO: Token de seguridad obligatorio -->
        {% csrf_token %}
        
        <label>Nombre paciente:</label><br>
        <input type="text" name="nombre" value="{{ registro.nombre }}" required><br><br>

        <label>¿Tiene ahogo o dificultad para respirar?:</label><br>
        <select name="dificultad_respiracion" required>
            <option value="Sí" {% if registro.dificultad_respiracion == 'Sí' %}selected{% endif %}>Sí</option>
            <option value="No" {% if registro.dificultad_respiracion == 'No' %}selected{% endif %}>No</option>
        </select><br><br>

        <label>Nivel de dolor (1 al 10):</label><br>
        <input type="number" name="dolor" value="{{ registro.dolor }}" required><br><br>

        <button type="submit">Guardar</button>
        <a href="{% url 'lista' %}">Cancelar</a>
    </form>
</body>
</html>
